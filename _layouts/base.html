<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body>
    {% unless page.layout == 'about' %}
    <header class="site-header">
      <div class="site-header-inner">
        <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">About</a>
          <a href="{{ '/publication/' | relative_url }}">Publications</a>
          <a href="{{ '/misc/' | relative_url }}">Misc</a>
        </nav>
      </div>
    </header>
    {% endunless %}

    <main class="{% if page.layout == 'about' %}academic-main{% else %}page-main{% endif %}{% if page.page_class %} {{ page.page_class }}{% endif %}">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>&copy; <time datetime="{{ site.time }}">{{ site.time | date: '%Y' }}</time> {{ site.author.name }}.</span>
    </footer>
  </body>
</html>
